<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨染 · 小说生成器（静态版）</title>
<style>
  :root{
    --paper:#F7F1E6; --ink:#2B2620; --ink2:#6E6255; --line:#E2D8C6;
    --card:#FFFFFF; --accent:#B4492E; --accent2:#3F5C7A; --gold:#C9A227; --chip:#F2E8D8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif; line-height:1.85; padding:0 0 60px;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 22px;}
  header{text-align:center; padding:44px 0 8px;}
  header .tag{display:inline-block; font-size:12px; letter-spacing:4px; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:4px 18px; margin-bottom:14px;}
  header h1{font-size:30px; letter-spacing:3px;}
  header .sub{margin-top:8px; color:var(--ink2); font-size:13px;}
  .main{display:flex; flex-wrap:wrap; gap:20px; margin-top:26px; align-items:flex-start;}
  .panel{flex:1 1 330px; min-width:0; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 24px;}
  .out{flex:1 1 560px; min-width:0;}
  h2{font-size:16px; letter-spacing:1px; margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid var(--line);}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; color:var(--ink2); margin-bottom:5px; letter-spacing:1px;}
  .field label b{color:var(--ink); font-weight:600;}
  select,input[type=text],textarea{width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:#FDFBF5; font-family:inherit; font-size:14px; color:var(--ink);}
  textarea{min-height:58px; resize:vertical;}
  .chips{display:flex; flex-wrap:wrap; gap:7px;}
  .chips label{font-size:12.5px; color:#4A4238; background:#F6EFE2; border:1px solid var(--line); border-radius:999px; padding:3px 12px; cursor:pointer; user-select:none; display:inline-flex; align-items:center; gap:5px;}
  .chips input{accent-color:var(--accent);}
  .chips label.on{background:#F3E3D8; border-color:var(--accent); color:var(--accent);}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
  .btn{flex:1 1 auto; border:none; border-radius:10px; padding:10px 14px; font-family:inherit; font-size:14px; cursor:pointer; background:var(--accent); color:#fff; letter-spacing:1px;}
  .btn.ghost{background:#fff; color:var(--accent2); border:1px solid var(--accent2);}
  .btn.small{padding:7px 12px; font-size:12.5px; flex:0 0 auto; background:#fff; color:var(--ink2); border:1px solid var(--line);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .out .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .storycard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:30px 34px; min-height:260px;}
  .storycard .stitle{font-size:24px; text-align:center; letter-spacing:4px; margin-bottom:6px;}
  .storycard .smeta{text-align:center; font-size:12px; color:var(--ink2); margin-bottom:18px; letter-spacing:1px;}
  .storycard .sbody p{text-indent:2em; font-size:15.5px; margin-bottom:12px; text-align:justify;}
  .storycard .sbody p.first::first-letter{font-size:32px; float:left; line-height:1.15; margin:2px 8px 0 0; color:var(--accent); font-weight:700;}
  .placeholder{color:#B5A99A; text-align:center; padding:80px 0; font-size:14px;}
  .note{margin-top:14px; background:#F1F4F8; border-left:3px solid var(--accent2); border-radius:0 10px 10px 0; padding:12px 16px; font-size:13px; color:#46505C; line-height:1.8;}
  .note b{color:var(--accent2);}
  .hist{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
  .hist .item{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13px;}
  .hist .item .t{color:var(--ink); font-weight:600;}
  .hist .item .m{color:var(--ink2); font-size:12px;}
  .hist .item .btn{flex:0 0 auto;}
  .foot{margin-top:34px; text-align:center; color:var(--ink2); font-size:12px; border-top:1px solid var(--line); padding-top:16px; letter-spacing:1px;}
  @media (max-width:640px){
    .wrap{padding:0 14px;}
    .storycard{padding:20px 16px;}
    header h1{font-size:24px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>墨染 · 小说生成器</h1>
    <div class="sub">模板库 × 风格库 · 本地规则引擎出稿 · 无需后端</div>
  </header>

  <div class="main">
    <!-- 设置面板 -->
    <div class="panel">
      <h2>设定输入</h2>

      <div class="field">
        <label><b>题材模板</b></label>
        <select id="genre">
          <option value="言情">言情</option>
          <option value="耽美">耽美</option>
          <option value="百合">百合</option>
          <option value="悬疑">悬疑</option>
          <option value="玄幻">玄幻</option>
          <option value="快穿">快穿</option>
          <option value="无限流">无限流</option>
          <option value="年代文">年代文</option>
          <option value="电竞">电竞</option>
        </select>
      </div>

      <div class="field">
        <label><b>文笔风格</b>（可多选，第一个为主风格）</label>
        <div class="chips" id="styleChips">
          <label><input type="checkbox" value="古风典雅" checked>古风典雅</label>
          <label><input type="checkbox" value="都市冷冽">都市冷冽</label>
          <label><input type="checkbox" value="文艺细腻">文艺细腻</label>
          <label><input type="checkbox" value="爽文快节奏">爽文快节奏</label>
          <label><input type="checkbox" value="悬疑克制">悬疑克制</label>
          <label><input type="checkbox" value="民国腔">民国腔</label>
          <label><input type="checkbox" value="治愈系">治愈系</label>
          <label><input type="checkbox" value="意识流">意识流</label>
          <label><input type="checkbox" value="热血少年">热血少年</label>
          <label><input type="checkbox" value="科幻冷峻">科幻冷峻</label>
          <label><input type="checkbox" value="轻喜剧">轻喜剧</label>
          <label><input type="checkbox" value="暗黑哥特">暗黑哥特</label>
        </div>
      </div>

      <div class="field">
        <label><b>篇幅</b></label>
        <select id="len">
          <option value="micro">微小说（约 300–500 字）</option>
          <option value="short" selected>短篇（约 800–1200 字）</option>
          <option value="mid">中篇（约 1500–2500 字）</option>
        </select>
      </div>

      <div class="field">
        <label><b>世界观 / 背景</b></label>
        <textarea id="world" placeholder="例：古风侯门 / 现代都市 / 星际时代……"></textarea>
      </div>

      <div class="field">
        <label><b>主角 A 人设</b></label>
        <input type="text" id="heroA" placeholder="例：沈砚，侯门庶子，冷峻隐忍">
      </div>

      <div class="field">
        <label><b>主角 B 人设</b></label>
        <input type="text" id="heroB" placeholder="例：谢孤鸿，江湖剑客，炽热直白">
      </div>

      <div class="field">
        <label><b>核心冲突</b></label>
        <input type="text" id="conflict" placeholder="例：家族利益与自由的两难">
      </div>

      <div class="field">
        <label><b>可选桥段</b>（勾选后写进故事）</label>
        <div class="chips" id="tropeChips">
          <label><input type="checkbox" value="初见">初见</label>
          <label><input type="checkbox" value="雨夜">雨夜</label>
          <label><input type="checkbox" value="误会">误会</label>
          <label><input type="checkbox" value="告白">告白</label>
          <label><input type="checkbox" value="破镜重圆">破镜重圆</label>
          <label><input type="checkbox" value="宿敌相救">宿敌相救</label>
          <label><input type="checkbox" value="共伞">共伞</label>
          <label><input type="checkbox" value="旧信">旧信</label>
          <label><input type="checkbox" value="替身">替身</label>
          <label><input type="checkbox" value="金手指">金手指</label>
        </div>
      </div>

      <div class="field">
        <label><b>补充要求</b>（可选）</label>
        <textarea id="extra" placeholder="例：想要一个反转结尾 / BE 或 HE"></textarea>
      </div>

      <div class="btnrow">
        <button class="btn" id="genBtn">生成文章</button>
        <button class="btn ghost" id="copyBtn">复制创作指令</button>
      </div>
    </div>

    <!-- 输出区 -->
    <div class="out">
      <div class="toolbar">
        <button class="btn small" id="againBtn">换风格重出</button>
        <button class="btn small" id="regBtn">换题材重出</button>
        <button class="btn small" id="contBtn">续写一段</button>
        <button class="btn small" id="saveBtn">存入版本库</button>
      </div>

      <div class="storycard" id="storycard">
        <div class="placeholder">在左侧设定题材、风格与人物，点击「生成文章」—— 一篇按模板骨架与风格笔法组合的初稿会出现在这里。</div>
      </div>

      <div class="note" id="engineNote" style="display:none;">
        <b>生成说明：</b>本页为<b>本地规则引擎初稿</b>（无需后端即可运行），用于快速成型与结构预览，文字为程序按模板与风格素材组合生成。需要高级文学质感时，点击「复制创作指令」，把设定发给我精写。
      </div>

      <div class="hist" id="hist" style="display:none;">
        <div style="font-size:13px;color:var(--ink2);letter-spacing:1px;">版本库（多版本对比）</div>
        <div id="histList"></div>
      </div>
    </div>
  </div>

  <div class="foot">墨染 · 小说生成器 · 静态版 · 内置 9 套题材模板 × 12 种文笔风格</div>
</div>

<script>
(function(){
  "use strict";

  /* ============ 素材库 ============ */

  var GENRES = {
    "言情": {
      title: ["偏偏心动","旧时光与你","一念之差","遇见你之后","此生共你"],
      beats: [
        { label:"相遇·钩子", lines:[
          "{world}里，{A}第一次注意到{B}，是在{trope}的场合。他原以为这只是寻常一面——直到发现自己的目光，再也挪不开了。",
          "{conflict}。这是{A}和{B}之间绕不开的结。偏偏老天还嫌不够，让他们在{trope}里又撞到了一起。"
        ]},
        { label:"试探·拉扯", lines:[
          "{A}开始有意无意地靠近{B}。{B}退一步，他就近一步；{B}冷一句，他就热一句。两个人谁也不肯先承认，心跳却早就出卖了自己。",
          "深夜独处时，{A}忽然问起那个谁都不愿碰的话题。{B}沉默了很久，答非所问：“你管这么多做什么？”语气是冷的，耳朵尖却红了。"
        ]},
        { label:"危机·转折", lines:[
          "转折发生在{trope}那天。{conflict}被彻底摆上台面，{A}不得不做选择——是守住自己的立场，还是守住{B}。",
          "他把所有退路都封死了，唯独给{B}留了一扇门。可{B}站在门外，红着眼眶问：“值得吗？”他没有犹豫：“你问的这句话，就是答案。”"
        ]},
        { label:"和解·顶点", lines:[
          "雨停的时候，{A}终于说了实话：“我认输。”{B}愣了很久，忽然笑了：“那你要记得，这一局，是你先动的心。”",
          "两个人都没有再多说什么。有些话，说一次就够重了；有些情，认了就是一辈子。"
        ]}
      ],
      ending: ["多年以后有人问起这段故事，{A}只说了两个字：值得。","从此，{world}里再也没有人能把他们分开了。"],
      tropeNote: "本稿推进了「相遇→试探→危机→和解」完整骨架"
    },
    "耽美": {
      title: ["与君书","此生不换","并肩","孤鸿","雪落无声"],
      beats: [
        { label:"宿敌·初见", lines:[
          "{A}遇见{B}那日，{world}正乱。所有人都以为他们是对头，只有{A}自己知道，第一眼起，他就想护住这个人。",
          "{conflict}。{A}不信命，{B}不信人。可当他们被命运捆在同一根绳上，谁也没能先松手。"
        ]},
        { label:"同盟·并肩", lines:[
          "一场变故让两人不得不并肩。{B}嘴上说着“各取所需”，却在{trope}时下意识挡在{A}身前。{A}看在眼里，没有拆穿。",
          "刀光剑影过后，两个人背靠着背坐在廊下。{B}低声道：“方才那一刀，你可以不挡。”{A}答：“可我想挡。”"
        ]},
        { label:"试探·羁绊", lines:[
          "深夜对坐，酒过三巡。{B}忽然问：“你为什么对我这么好？”{A}看着他的眼睛：“因为你是第一个，没把我当棋子的人。”",
          "{conflict}的真相揭开那天，{B}才知道，{A}为他挡下的远不止那一刀。旧伤结痂，新仇已了，可有些账，这辈子都还不清了。"
        ]},
        { label:"认定·同行", lines:[
          "“跟我走。”{A}说。{B}沉默了很久，解下腰间旧物递过去：“那，这条命，以后归你。”",
          "千山暮雪，两人一前一后走进夜色。没有人回头，因为从这一刻起，他们要去的，是同一个方向。"
        ]}
      ],
      ending: ["此后江湖提起这对名字，总说“形影不离”。只有他们自己知道，那不是传闻，是誓言。","{B}后来总说，当初那句“跟我走”，是他这一生听过最好听的话。"],
      tropeNote: "本稿推进了「宿敌→同盟→试探→羁绊→认定」骨架"
    },
    "百合": {
      title: ["绿萝","共伞","数叶子的人","她的名字","暮色正落"],
      beats: [
        { label:"目光交错", lines:[
          "{A}第一次见{B}，是在{trope}的场景里。{B}没有回头，可{A}记住了她低头时的那一缕发。",
          "后来{A}总来。{world}里那些别人不在意、她们却当成宝贝的细节，她们聊了很久很久。"
        ]},
        { label:"细碎日常", lines:[
          "{B}记得{A}爱喝什么，记得她来的时候带着什么样的气息，记得下雨天她不爱打伞。{A}也记得{B}怕什么、为什么事笑、为什么事沉默。",
          "她们聊过很多：聊一棵树被台风连根拔起，聊一杯咖啡凉透的温度，聊彼此为什么离开了原来的地方。"
        ]},
        { label:"彼此试探", lines:[
          "那天{B}说：“你对我，好像有点太好。”{A}没有否认，只说：“我想对你更好，可以吗？”",
          "这句话说出来之后，两个人都安静了很久。窗外的暮色一点点沉下去，像谁的心事，终于肯落地。"
        ]},
        { label:"坚定相守", lines:[
          "{conflict}袭来时，{B}先想到的不是自己，是别让{A}为难。可{A}已经站到她身前：“这一次，换我来。”",
          "“从今以后，我申请一直待在你身边。”{B}笑着红了眼眶：“批准了。”"
        ]}
      ],
      ending: ["此后每个雨天，她们共一把伞。伞不大，刚刚好装下两个人，和她们慢慢长出来的余生。","{A}把那株救活的花放进窗台，说：“你看，它活过来了。”{B}看着她，轻声说：“嗯，我们都活过来了。”"],
      tropeNote: "本稿推进了「目光交错→细碎日常→彼此试探→坚定相守」骨架"
    },
    "悬疑": {
      title: ["暗号","第七次回头","证词之外","雨夜笔录","她没说过"],
      beats: [
        { label:"案发·嫌疑", lines:[
          "{trope}发生的那个夜晚，{world}里所有人都说{B}有嫌疑。只有{A}在卷宗角落发现一行小字——那是只有{B}才懂的暗号。",
          "审讯室的灯亮了一整夜。{A}坐在{B}对面，一遍遍问同一个问题。{B}始终沉默，只是目光落在{A}的笔尖上，像在等什么。"
        ]},
        { label:"追查·不信", lines:[
          "{A}没有按流程定罪。他开始自己查——查现场、查时间、查每一个声称见过{B}的人。越查，疑点越多；疑点越多，他越确定：有人在说谎。",
          "{conflict}悬在头顶。同僚劝{A}别趟这浑水，他答：“证据说她是清白的，我就信证据。”"
        ]},
        { label:"反转·真相", lines:[
          "门再次打开时，{B}忽然笑了：“你查得没错，人是我带走的——因为真正的凶手，正坐在你身后。”",
          "真相大白那晚，{A}问：“你为什么不解释？”{B}说：“因为我相信，你会自己查清楚，然后选择相信我。”"
        ]}
      ],
      ending: ["档案封存那天，{A}在结案报告最后一页写道：本案的真相，不在证词里，在信任里。","多年后{B}再问起那晚，{A}只说了四个字：“幸好是你。”"],
      tropeNote: "本稿推进了「命案→嫌疑→反转→真相×情感双落点」骨架"
    },
    "玄幻": {
      title: ["蛰龙","废柴逆袭","一剑霜寒","我自登天","旧物藏锋"],
      beats: [
        { label:"废柴·开局", lines:[
          "{A}在{world}里是人尽皆知的废物。灵根尽废那日，没人知道，他捡到的那枚破戒指里，住着上古残魂。",
          "{conflict}压在肩头，同门嗤笑，家族冷眼。{A}把所有人嘲讽记在心里，面上却只说了句：“谢各位今日看得起。”"
        ]},
        { label:"奇遇·成长", lines:[
          "残魂传他心法，也传他一句真言：真正的强者，从不在顺境里诞生。于是寒来暑往，{A}在无人问津的角落里，一寸一寸地重新长出骨头。",
          "第一次出手时，满座皆惊。{A}没有解释，只是看向{B}站的方向——那里，有人在所有人嘲笑他时，递过一碗热饭。"
        ]},
        { label:"打脸·扬名", lines:[
          "宗门大比，满座哗然。曾经踩过{A}的人此刻脸色铁青——他们这才明白，{A}不是废物，是蛰伏的龙。",
          "“我从不记仇，”{A}拂袖而过，“但你们记住：当年递给我一碗热饭的人，今日起，由我护着。”"
        ]},
        { label:"登顶·相伴", lines:[
          "登顶那日，{A}站在山巅，忽然想起最初那句嘲讽。他没有记恨，只把旧事碾作尘土，笑着对{B}说：“走吧，上面的风景，比他们想象的还要好。”",
          "{world}的传说从这一日起改写。而传说里最动人的一笔，从来不是他登了多高——是他始终带着当初那碗热饭的暖意。"
        ]}
      ],
      ending: ["后来有人问{A}，一路走来最想谢谁。他想了很久，说：“谢那个在我最落魄时，没有嘲笑我的人。”","自此，{world}多了一段传奇，也多了一双并肩的背影。"],
      tropeNote: "本稿推进了「废柴→奇遇→打脸→登顶」骨架"

    var genre=GENRES[opts.genre]||GENRES["言情"];
    var styles=opts.styles.length?opts.styles:["古风典雅"];
    var primary=STYLES[styles[0]]||STYLES["古风典雅"];
    var secondary=styles.length>1?(STYLES[styles[1]]||null):null;
    var d={
      A: nameOf(opts.heroA) || opts.heroA || "他",
      B: nameOf(opts.heroB) || opts.heroB || "她",
      world: opts.world||"这座城市",
      conflict: opts.conflict||"一段说不清道不明的过往",
      trope: opts.tropes.length?opts.tropes.join("、"):"寻常"
    };
    var paras=[];
    var usedBeats=[];

    // 开篇：风格句 + 钩子
    if(rnd()<0.8){ paras.push(fill(pick(primary.flavor,rnd),d)); }
    var hook=fill(pick(genre.beats[0].lines,rnd),d);
    paras.push(hook);
    usedBeats.push(genre.beats[0].label);

    // 主体：按篇幅决定每幕句数
    var perBeat = opts.len==="micro" ? 1 : (opts.len==="short" ? 2 : 3);
    for(var b=1;b<genre.beats.length;b++){
      var beat=genre.beats[b];
      var n=Math.min(perBeat, beat.lines.length);
      for(var k=0;k<n;k++){
        var line = k===0 ? fill(pick(beat.lines,rnd),d) : fill(beat.lines[(rndInt(beat.lines.length))],d);
        paras.push(line);
        // 每幕穿插主风格句
        if(rnd()<0.5){ paras.push(fill(pick(primary.flavor,rnd),d)); }
        if(secondary && rnd()<0.35){ paras.push(fill(pick(secondary.flavor,rnd),d)); }
      }
      usedBeats.push(beat.label);
    }

    // 收尾
    if(rnd()<0.7){ paras.push(fill(pick(primary.close,rnd),d)); }
    paras.push(fill(pick(genre.ending,rnd),d));

    // 补充要求注入（若写了“反转/HE/BE”等）
    if(opts.extra && /反转/i.test(opts.extra)){
      paras.splice(paras.length-1, 0, fill("“其实有一件事，我从头到尾都没有告诉你。”{B}说。{A}静静听完，忽然笑了：“巧了，我也藏了一件。”——两个人相视一笑，谜底在这一刻，才算真正揭开。", d));
    }
    if(opts.extra && /be|悲剧|结局不好/i.test(opts.extra)){
      paras.push(fill("多年以后，{A}偶尔还会想起那天。如果时光能重来，他大概还是会做出同样的选择——有些结局，明知道痛，也愿意赴。", d));
    }

    var title=pick(genre.title,rnd);
    var meta=opts.genre+" · "+(opts.styles.length?opts.styles.join("+"):"古风典雅")+" · "+(opts.len==="micro"?"微小说":opts.len==="short"?"短篇":"中篇");
    return { title:title, meta:meta, paras:paras, beats:usedBeats, styles:styles, genreNote:genre.tropeNote };
  }

  function renderStory(s, first){
    var card=document.getElementById("storycard");
    var h='<div class="stitle">'+s.title+'</div>';
    h+='<div class="smeta">'+s.meta+'</div>';
    h+='<div class="sbody">';
    for(var i=0;i<s.paras.length;i++){
      h+='<p'+(i===0?' class="first"':'')+'>'+s.paras[i]+'</p>';
    }
    h+='</div>';
    h+='<div class="note"><b>模板落点：</b>'+s.genreNote+'——实际用到：'+s.beats.join(" → ")+'。<br><b>风格落点：</b>'+s.styles.join(" + ")+'：'+(s.styles.length>1?"主风格定调、副风格点缀":STYLES[s.styles[0]]?"按该风格的句式与意象成句":'')+'。</div>';
    card.innerHTML=h;
    document.getElementById("engineNote").style.display="block";
  }

  /* ============ 状态与历史 ============ */

  var history=[];
  var current=null;

  function getOpts(){
    return {
      genre: document.getElementById("genre").value,
      styles: collectChips("styleChips"),
      len: document.getElementById("len").value,
      world: document.getElementById("world").value.trim(),
      heroA: document.getElementById("heroA").value.trim(),
      heroB: document.getElementById("heroB").value.trim(),
      conflict: document.getElementById("conflict").value.trim(),
      tropes: collectChips("tropeChips"),
      extra: document.getElementById("extra").value.trim()
    };
  }

  function generate(opts){
    if(!opts.styles.length){ alert("请至少选择一种文笔风格"); return; }
    current=buildStory(opts);
    renderStory(current);
  }

  function renderHist(){
    var list=document.getElementById("histList");
    var h="";
    for(var i=0;i<history.length;i++){
      var it=history[i];
      h+='<div class="item"><div><div class="t">'+it.title+'</div><div class="m">'+it.meta+'</div></div><button class="btn small" data-i="'+i+'">查看</button></div>';
    }
    list.innerHTML=h;
    document.getElementById("hist").style.display=history.length?"flex":"none";
    var btns=list.querySelectorAll("button");
    for(var j=0;j<btns.length;j++){
      btns[j].addEventListener("click",(function(idx){return function(){ renderStory(history[idx],false); };})(parseInt(btns[j].getAttribute("data-i"),10)));
    }
  }

  function copyPrompt(){
    var o=getOpts();
    var lines=[
      "请用以下设定为我写一篇小说：",
      "题材模板："+o.genre,
      "文笔风格："+(o.styles.join("、")||"古风典雅"),
      "篇幅："+({micro:"微小说",short:"短篇",mid:"中篇"}[o.len]),
      "世界观："+(o.world||"（未填）"),
      "主角A："+(o.heroA||"（未填）"),
      "主角B："+(o.heroB||"（未填）"),
      "核心冲突："+(o.conflict||"（未填）"),
      "桥段："+(o.tropes.length?o.tropes.join("、"):"（未选）"),
      "补充要求："+(o.extra||"（无）")
    ];
    var ta=document.createElement("textarea");
    ta.value=lines.join("\n");
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    alert("创作指令已复制，粘贴到豆包对话中发给我，我来精写全文。");
  }

  /* ============ 事件绑定 ============ */

  document.getElementById("genBtn").addEventListener("click", function(){ generate(getOpts()); });

  document.getElementById("againBtn").addEventListener("click", function(){
    if(!current){ return; }
    var o=getOpts();
    // 轮换主风格
    var all=["古风典雅","都市冷冽","文艺细腻","爽文快节奏","悬疑克制","民国腔","治愈系","意识流","热血少年","科幻冷峻","轻喜剧","暗黑哥特"];
    var cur=o.styles[0];
    var idx=all.indexOf(cur);
    o.styles=[all[(idx+1)%all.length]];
    generate(o);
  });

  document.getElementById("regBtn").addEventListener("click", function(){
    var o=getOpts();
    var all=["言情","耽美","百合","悬疑","玄幻","快穿","无限流","年代文","电竞"];
    var idx=all.indexOf(o.genre);
    o.genre=all[(idx+1)%all.length];
    document.getElementById("genre").value=o.genre;
    generate(o);
  });

  document.getElementById("contBtn").addEventListener("click", function(){
    if(!current){ return; }
    var o=getOpts();
    var dd={A:nameOf(o.heroA)||o.heroA||"他",B:nameOf(o.heroB)||o.heroB||"她",world:o.world||"这座城市",conflict:o.conflict||"",trope:o.tropes.length?o.tropes.join("、"):"寻常"};
    var st=STYLES[current.styles[0]]||STYLES["古风典雅"];
    current.paras.push(fill("后来……后来发生的事，{A}很少对人提起。他只是偶尔想起{trope}那天，想起{B}看他的那个眼神。{world}照旧运转，可有些东西，从那天起就不一样了。", dd));
    if(rnd()<0.6){ current.paras.push(fill(pick(st.flavor,rnd), dd)); }
    renderStory(current);
  });

  document.getElementById("saveBtn").addEventListener("click", function(){
    if(!current){ return; }
    history.push({title:current.title, meta:current.meta, story:current});
    renderHist();
  });

  document.getElementById("copyBtn").addEventListener("click", copyPrompt);

  // 桥段/风格 chips 高亮
  ["styleChips","tropeChips"].forEach(function(id){
    var box=document.getElementById(id);
    box.addEventListener("change", function(e){
      var lab=e.target.closest("label");
      if(lab){ lab.classList.toggle("on", e.target.checked); }
    });
    var labels=box.querySelectorAll("label");
    for(var i=0;i<labels.length;i++){
      if(labels[i].querySelector("input").checked){ labels[i].classList.add("on"); }
    }
  });
})();
</script>
</body>
</html>
